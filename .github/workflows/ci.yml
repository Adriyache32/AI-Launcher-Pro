name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-mock
          # Install tkinter (usually included)
      
      - name: Lint with flake8
        run: |
          flake8 launcher.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 launcher.py --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      
      - name: Run tests
        run: |
          python -m pytest --tb=short -v || echo "No tests found, skipping"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Build package
        run: |
          pip install build
          python -m build --wheel --sdist || echo "Build script not configured"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
